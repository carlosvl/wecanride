<template>
    <div class="slds-card slds-p-around_medium">
        <h2 class="slds-text-heading_medium slds-m-bottom_medium">Height &amp; Weight</h2>

        <template lwc:if={isCompleted}>
            <div class="slds-notify slds-notify_alert slds-alert_success slds-m-bottom_medium" role="alert">
                <span>Height and weight have been recorded. You may update below.</span>
            </div>
        </template>

        <p class="slds-text-body_regular slds-m-bottom_medium">
            Please provide your current height and weight. This information helps us match you
            with the right horse for your safety and comfort.
        </p>

        <div class="slds-grid slds-wrap slds-gutters">
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small">
                <lightning-input
                    label="Height"
                    data-field="height"
                    value={height}
                    onchange={handleInputChange}
                    required
                    placeholder="e.g. 5'6&quot;"
                ></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small">
                <lightning-input
                    label="Weight (lbs)"
                    type="number"
                    data-field="weight"
                    value={weight}
                    onchange={handleInputChange}
                    required
                    min="0"
                    max="500"
                ></lightning-input>
            </div>
        </div>

        <div class="slds-grid slds-grid_align-end slds-m-top_medium">
            <lightning-button label="Cancel" variant="neutral" onclick={handleCancel} class="slds-m-right_small"></lightning-button>
            <lightning-button label="Save & Continue" variant="brand" onclick={handleSave} disabled={isSaving}></lightning-button>
        </div>

        <template lwc:if={isSaving}>
            <lightning-spinner alternative-text="Saving" size="small"></lightning-spinner>
        </template>
    </div>
</template>
