<template>
    <div class="slds-card slds-p-around_medium">
        <h2 class="slds-text-heading_medium slds-m-bottom_small">Welcome to We Can Ride Registration</h2>
        <p class="slds-text-body_regular slds-text-color_weak slds-m-bottom_large">
            Please select the program you are registering for.
        </p>

        <!-- Error Banner -->
        <template lwc:if={error}>
            <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_medium" role="alert">
                <span>{error}</span>
            </div>
        </template>

        <!-- Program Type Selection -->
        <div class="slds-m-bottom_large">
            <lightning-radio-group
                label="Which program are you registering for?"
                options={programOptions}
                value={selectedProgram}
                onchange={handleProgramChange}
                required
                type="radio"
            ></lightning-radio-group>
        </div>

        <!-- Service Type Selection (Mental Health only) -->
        <template lwc:if={isMentalHealth}>
            <div class="slds-m-bottom_large slds-box slds-box_x-small slds-theme_shade">
                <p class="slds-text-heading_small slds-m-bottom_small">
                    What services are you seeking? <em>(Select all that apply.)</em>
                </p>
                <lightning-checkbox-group
                    label="Therapy Services"
                    options={serviceTypeOptions}
                    value={selectedServices}
                    onchange={handleServiceChange}
                    variant="label-hidden"
                ></lightning-checkbox-group>
            </div>
        </template>

        <!-- Action Buttons -->
        <div class="slds-grid slds-grid_align-end slds-m-top_medium">
            <lightning-button
                label="Cancel"
                variant="neutral"
                onclick={handleCancel}
                class="slds-m-right_small"
            ></lightning-button>
            <lightning-button
                label={saveButtonLabel}
                variant="brand"
                onclick={handleSave}
                disabled={!canSave}
            ></lightning-button>
        </div>

        <template lwc:if={isSaving}>
            <lightning-spinner alternative-text="Saving" size="small"></lightning-spinner>
        </template>
    </div>
</template>
