<template>
    <div class="slds-card slds-p-around_medium">
        <h2 class="slds-text-heading_medium slds-m-bottom_medium">Photo Release</h2>

        <template lwc:if={isCompleted}>
            <div class="slds-notify slds-notify_alert slds-alert_success slds-m-bottom_medium" role="alert">
                <span>This form has already been completed. You may update your selection below.</span>
            </div>
        </template>

        <p class="slds-text-body_regular slds-m-bottom_medium">
            We Can Ride occasionally takes photographs and videos of participants during classes and events.
            These images may be used in newsletters, on our website, social media, or in promotional materials.
            Please indicate your preference below.
        </p>

        <div class="slds-form-element slds-m-bottom_large">
            <lightning-radio-group
                label="Photo Authorization"
                name="photoConsent"
                options={consentOptions}
                value={consent}
                onchange={handleConsentChange}
                required
            ></lightning-radio-group>
        </div>

        <p class="error-message slds-text-color_error slds-m-bottom_small"></p>

        <div class="slds-grid slds-grid_align-end slds-m-top_medium">
            <lightning-button
                label="Cancel"
                variant="neutral"
                onclick={handleCancel}
                class="slds-m-right_small"
            ></lightning-button>
            <lightning-button
                label="Save & Continue"
                variant="brand"
                onclick={handleSave}
                disabled={isSaving}
            ></lightning-button>
        </div>

        <template lwc:if={isSaving}>
            <lightning-spinner alternative-text="Saving" size="small"></lightning-spinner>
        </template>
    </div>
</template>
