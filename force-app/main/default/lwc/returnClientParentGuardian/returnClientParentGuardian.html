<template>
    <div class="slds-card slds-p-around_medium">
        <h2 class="slds-text-heading_medium slds-m-bottom_medium">Parent / Guardian Information</h2>

        <!-- Loading -->
        <template lwc:if={isLoading}>
            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
        </template>

        <!-- ═══════ OVERVIEW VIEW ═══════ -->
        <template lwc:if={isOverview}>
            <!-- 1st Guardian Card -->
            <div class="slds-card slds-p-around_small slds-m-bottom_medium">
                <h3 class="slds-text-heading_small slds-m-bottom_small">
                    <lightning-icon icon-name="utility:user" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                    1st Guardian
                </h3>

                <template lwc:if={hasFirstGuardian}>
                    <div class="slds-grid slds-wrap slds-gutters_small">
                        <div class="slds-col slds-size_1-of-2 slds-p-bottom_xx-small">
                            <p class="slds-text-body_small slds-text-color_weak">Name</p>
                            <p class="slds-text-body_regular">{firstGuardianName}</p>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-p-bottom_xx-small">
                            <p class="slds-text-body_small slds-text-color_weak">Email</p>
                            <p class="slds-text-body_regular">{firstGuardianEmail}</p>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-p-bottom_xx-small">
                            <p class="slds-text-body_small slds-text-color_weak">Phone</p>
                            <p class="slds-text-body_regular">{firstGuardianPhone}</p>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-p-bottom_xx-small">
                            <p class="slds-text-body_small slds-text-color_weak">Employer</p>
                            <p class="slds-text-body_regular">{firstGuardianEmployer}</p>
                        </div>
                    </div>
                    <div class="slds-m-top_small">
                        <lightning-button label="Edit" variant="neutral" onclick={handleEditFirst} class="slds-m-right_small"></lightning-button>
                        <lightning-button label="Remove Contact" variant="destructive-text" onclick={handleRemoveFirst}></lightning-button>
                    </div>
                </template>

                <template lwc:else>
                    <p class="slds-text-body_regular slds-text-color_weak">No 1st guardian assigned.</p>
                    <lightning-button label="Add 1st Guardian" variant="brand" onclick={handleAddFirst} class="slds-m-top_small"></lightning-button>
                </template>
            </div>

            <!-- 2nd Guardian Card -->
            <div class="slds-card slds-p-around_small slds-m-bottom_medium">
                <h3 class="slds-text-heading_small slds-m-bottom_small">
                    <lightning-icon icon-name="utility:user" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                    2nd Guardian
                </h3>

                <template lwc:if={hasSecondGuardian}>
                    <div class="slds-grid slds-wrap slds-gutters_small">
                        <div class="slds-col slds-size_1-of-2 slds-p-bottom_xx-small">
                            <p class="slds-text-body_small slds-text-color_weak">Name</p>
                            <p class="slds-text-body_regular">{secondGuardianName}</p>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-p-bottom_xx-small">
                            <p class="slds-text-body_small slds-text-color_weak">Email</p>
                            <p class="slds-text-body_regular">{secondGuardianEmail}</p>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-p-bottom_xx-small">
                            <p class="slds-text-body_small slds-text-color_weak">Phone</p>
                            <p class="slds-text-body_regular">{secondGuardianPhone}</p>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-p-bottom_xx-small">
                            <p class="slds-text-body_small slds-text-color_weak">Employer</p>
                            <p class="slds-text-body_regular">{secondGuardianEmployer}</p>
                        </div>
                    </div>
                    <div class="slds-m-top_small">
                        <lightning-button label="Edit" variant="neutral" onclick={handleEditSecond} class="slds-m-right_small"></lightning-button>
                        <lightning-button label="Remove Contact" variant="destructive-text" onclick={handleRemoveSecond}></lightning-button>
                    </div>
                </template>

                <template lwc:else>
                    <p class="slds-text-body_regular slds-text-color_weak">No 2nd guardian assigned.</p>
                    <lightning-button label="Add 2nd Guardian" variant="brand" onclick={handleAddSecond} class="slds-m-top_small"></lightning-button>
                </template>
            </div>

            <!-- Overview Action Buttons -->
            <div class="slds-grid slds-grid_align-end slds-m-top_medium">
                <lightning-button label="Cancel" variant="neutral" onclick={handleCancel} class="slds-m-right_small"></lightning-button>
                <lightning-button label="Done" variant="brand" onclick={handleDone}></lightning-button>
            </div>
        </template>

        <!-- ═══════ EDIT VIEW ═══════ -->
        <template lwc:if={isEditView}>
            <h3 class="slds-text-heading_small slds-m-bottom_medium">{editFormTitle}</h3>

            <div class="slds-grid slds-wrap slds-gutters">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small">
                    <lightning-input
                        label="First Name"
                        data-field="firstName"
                        value={firstName}
                        onchange={handleInputChange}
                        required
                    ></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small">
                    <lightning-input
                        label="Last Name"
                        data-field="lastName"
                        value={lastName}
                        onchange={handleInputChange}
                        required
                    ></lightning-input>
                </div>
            </div>

            <div class="slds-grid slds-wrap slds-gutters">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small">
                    <lightning-input
                        type="email"
                        label="Email"
                        data-field="email"
                        value={email}
                        onchange={handleInputChange}
                    ></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small">
                    <lightning-input
                        type="tel"
                        label="Phone"
                        data-field="phone"
                        value={phone}
                        onchange={handleInputChange}
                    ></lightning-input>
                </div>
            </div>

            <div class="slds-m-bottom_small">
                <lightning-input
                    label="Employer"
                    data-field="employer"
                    value={employer}
                    onchange={handleInputChange}
                ></lightning-input>
            </div>

            <div class="slds-grid slds-grid_align-end slds-m-top_medium">
                <lightning-button label="Back" variant="neutral" onclick={handleBackToOverview} class="slds-m-right_small"></lightning-button>
                <lightning-button label="Save" variant="brand" onclick={handleSaveEdit} disabled={isSaving}></lightning-button>
            </div>

            <template lwc:if={isSaving}>
                <lightning-spinner alternative-text="Saving" size="small"></lightning-spinner>
            </template>
        </template>

        <!-- ═══════ SELECT VIEW ═══════ -->
        <template lwc:if={isSelectView}>
            <h3 class="slds-text-heading_small slds-m-bottom_medium">Select a Contact</h3>
            <p class="slds-text-body_regular slds-m-bottom_medium">
                Choose an existing household contact or create a new one.
            </p>

            <lightning-radio-group
                label="Select Contact"
                options={householdContactOptions}
                value={selectedContactId}
                onchange={handleSelectContact}
                type="radio"
            ></lightning-radio-group>

            <div class="slds-grid slds-grid_align-end slds-m-top_medium">
                <lightning-button label="Back" variant="neutral" onclick={handleBackToOverview} class="slds-m-right_small"></lightning-button>
                <lightning-button label="Select" variant="brand" onclick={handleSelectSubmit} disabled={isSaving}></lightning-button>
            </div>
        </template>

        <!-- ═══════ ADD NEW VIEW ═══════ -->
        <template lwc:if={isAddView}>
            <h3 class="slds-text-heading_small slds-m-bottom_medium">{addFormTitle}</h3>

            <div class="slds-grid slds-wrap slds-gutters">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small">
                    <lightning-input
                        label="First Name"
                        data-field="firstName"
                        value={firstName}
                        onchange={handleInputChange}
                        required
                    ></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small">
                    <lightning-input
                        label="Last Name"
                        data-field="lastName"
                        value={lastName}
                        onchange={handleInputChange}
                        required
                    ></lightning-input>
                </div>
            </div>

            <div class="slds-grid slds-wrap slds-gutters">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small">
                    <lightning-input
                        type="email"
                        label="Email"
                        data-field="email"
                        value={email}
                        onchange={handleInputChange}
                    ></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small">
                    <lightning-input
                        type="tel"
                        label="Phone"
                        data-field="phone"
                        value={phone}
                        onchange={handleInputChange}
                    ></lightning-input>
                </div>
            </div>

            <div class="slds-m-bottom_small">
                <lightning-input
                    label="Employer"
                    data-field="employer"
                    value={employer}
                    onchange={handleInputChange}
                ></lightning-input>
            </div>

            <div class="slds-grid slds-grid_align-end slds-m-top_medium">
                <lightning-button label="Back" variant="neutral" onclick={handleBackToOverview} class="slds-m-right_small"></lightning-button>
                <lightning-button label="Save" variant="brand" onclick={handleSaveNew} disabled={isSaving}></lightning-button>
            </div>

            <template lwc:if={isSaving}>
                <lightning-spinner alternative-text="Saving" size="small"></lightning-spinner>
            </template>
        </template>
    </div>
</template>
