<template>
    <!-- Paused State -->
    <template lwc:if={isPaused}>
        <div class="slds-card slds-p-around_large slds-text-align_center">
            <div class="slds-m-bottom_large">
                <lightning-icon icon-name="utility:info" size="large" alternative-text="Information"></lightning-icon>
            </div>
            <h2 class="slds-text-heading_medium slds-m-bottom_medium">Application Paused</h2>
            <p class="slds-text-body_regular slds-m-bottom_large paused-message">
                <em>{pausedMessage}</em>
            </p>
            <p class="slds-text-body_small slds-text-color_weak">
                If you have questions, please contact We Can Ride at
                <strong>clients@wecanride.org</strong> or call
                <strong>952-934-0057</strong>.
            </p>
        </div>
    </template>

    <!-- Screening Form -->
    <template lwc:else>
        <div class="slds-card slds-p-around_medium">
            <h2 class="slds-text-heading_medium slds-m-bottom_small">
                Clinical History &amp; Safety Considerations
            </h2>
            <p class="slds-text-body_regular slds-text-color_weak slds-m-bottom_large">
                Please review and select all that apply. This information helps us ensure we can safely and appropriately meet your needs.
            </p>

            <!-- Error Banner -->
            <template lwc:if={error}>
                <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_medium" role="alert">
                    <span>{error}</span>
                </div>
            </template>

            <!-- Clinical Flag Checkboxes -->
            <div class="slds-m-bottom_large">
                <lightning-checkbox-group
                    label="Select all that apply:"
                    options={flagOptions}
                    value={selectedFlags}
                    onchange={handleFlagChange}
                ></lightning-checkbox-group>
            </div>

            <!-- Detail Text Area (shown when flags are checked) -->
            <template lwc:if={hasFlags}>
                <div class="slds-m-bottom_large slds-box slds-box_x-small slds-theme_warning">
                    <lightning-textarea
                        label="If yes to any, please explain in further detail"
                        value={detailText}
                        onchange={handleDetailChange}
                        required
                        max-length="5000"
                        placeholder="Please provide additional details about the items you selected above..."
                    ></lightning-textarea>
                </div>
            </template>

            <!-- Action Buttons -->
            <div class="slds-grid slds-grid_align-end slds-m-top_medium">
                <lightning-button
                    label="Cancel"
                    variant="neutral"
                    onclick={handleCancel}
                    class="slds-m-right_small"
                ></lightning-button>
                <lightning-button
                    label={saveButtonLabel}
                    variant="brand"
                    onclick={handleSave}
                    disabled={cannotSave}
                ></lightning-button>
            </div>

            <template lwc:if={isSaving}>
                <lightning-spinner alternative-text="Saving" size="small"></lightning-spinner>
            </template>
        </div>
    </template>
</template>
