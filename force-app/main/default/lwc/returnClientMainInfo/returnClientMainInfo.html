<template>
    <div class="slds-card slds-p-around_medium">
        <h2 class="slds-text-heading_medium slds-m-bottom_medium">Client Information</h2>

        <p class="slds-text-body_regular slds-m-bottom_medium">
            Please review and update your personal information below.
        </p>

        <!-- Name Row -->
        <div class="slds-grid slds-wrap slds-gutters">
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small">
                <lightning-input
                    label="First Name"
                    data-field="firstName"
                    value={firstName}
                    onchange={handleInputChange}
                    required
                ></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small">
                <lightning-input
                    label="Last Name"
                    data-field="lastName"
                    value={lastName}
                    onchange={handleInputChange}
                    required
                ></lightning-input>
            </div>
        </div>

        <!-- Gender / DOB Row -->
        <div class="slds-grid slds-wrap slds-gutters">
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small">
                <lightning-combobox
                    label="Gender"
                    data-field="gender"
                    value={gender}
                    options={genderOptions}
                    onchange={handleGenderChange}
                    required
                ></lightning-combobox>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small">
                <lightning-input
                    type="date"
                    label="Date of Birth"
                    data-field="dateOfBirth"
                    value={dateOfBirth}
                    onchange={handleInputChange}
                    required
                ></lightning-input>
            </div>
        </div>

        <!-- Height / Weight Row -->
        <div class="slds-grid slds-wrap slds-gutters">
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small">
                <lightning-input
                    label={heightLabel}
                    data-field="height"
                    value={height}
                    onchange={handleInputChange}
                    required={heightWeightRequired}
                    placeholder="e.g., 5'6&quot;"
                ></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small">
                <lightning-input
                    type="number"
                    label={weightLabel}
                    data-field="weight"
                    value={weight}
                    onchange={handleInputChange}
                    required={heightWeightRequired}
                    min="0"
                    step="0.1"
                ></lightning-input>
            </div>
        </div>

        <!-- Weight Warning -->
        <template lwc:if={showWeightWarning}>
            <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_small" role="alert">
                <span>{weightWarning}</span>
            </div>
        </template>

        <!-- Address Section -->
        <h3 class="slds-text-heading_small slds-m-top_medium slds-m-bottom_small">Address</h3>

        <div class="slds-m-bottom_small">
            <lightning-input
                label="Street"
                data-field="street"
                value={street}
                onchange={handleInputChange}
                required
            ></lightning-input>
        </div>

        <div class="slds-grid slds-wrap slds-gutters">
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-p-bottom_small">
                <lightning-input
                    label="City"
                    data-field="city"
                    value={city}
                    onchange={handleInputChange}
                    required
                ></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-p-bottom_small">
                <lightning-input
                    label="State"
                    data-field="state"
                    value={state}
                    onchange={handleInputChange}
                    required
                ></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-p-bottom_small">
                <lightning-input
                    label="ZIP"
                    data-field="zip"
                    value={zip}
                    onchange={handleInputChange}
                    required
                ></lightning-input>
            </div>
        </div>

        <!-- Contact Info Section -->
        <h3 class="slds-text-heading_small slds-m-top_medium slds-m-bottom_small">Contact Information</h3>

        <div class="slds-grid slds-wrap slds-gutters">
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small">
                <lightning-input
                    type="email"
                    label="Email"
                    data-field="email"
                    value={email}
                    onchange={handleInputChange}
                ></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small">
                <lightning-input
                    type="email"
                    label="Work Email"
                    data-field="workEmail"
                    value={workEmail}
                    onchange={handleInputChange}
                ></lightning-input>
            </div>
        </div>

        <div class="slds-grid slds-wrap slds-gutters">
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small">
                <lightning-input
                    type="tel"
                    label="Phone"
                    data-field="phone"
                    value={phone}
                    onchange={handleInputChange}
                ></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small">
                <lightning-input
                    type="tel"
                    label="Mobile Phone"
                    data-field="mobilePhone"
                    value={mobilePhone}
                    onchange={handleInputChange}
                ></lightning-input>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="slds-grid slds-grid_align-end slds-m-top_medium">
            <lightning-button label="Cancel" variant="neutral" onclick={handleCancel} class="slds-m-right_small"></lightning-button>
            <lightning-button label="Save & Continue" variant="brand" onclick={handleSave} disabled={isSaving}></lightning-button>
        </div>

        <template lwc:if={isSaving}>
            <lightning-spinner alternative-text="Saving" size="small"></lightning-spinner>
        </template>
    </div>
</template>
