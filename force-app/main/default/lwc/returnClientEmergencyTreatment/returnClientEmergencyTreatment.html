<template>
    <div class="slds-card slds-p-around_medium">
        <h2 class="slds-text-heading_medium slds-m-bottom_medium">Authorization for Emergency Medical Treatment</h2>

        <template lwc:if={isCompleted}>
            <div class="slds-notify slds-notify_alert slds-alert_success slds-m-bottom_medium" role="alert">
                <span>This form has already been completed. You may update your information below.</span>
            </div>
        </template>

        <p class="slds-text-body_regular slds-m-bottom_medium">
            In case of an emergency, We Can Ride is authorized to seek medical treatment on behalf of the participant.
            Please provide the following information.
        </p>

        <div class="slds-grid slds-wrap slds-gutters">
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small">
                <lightning-input
                    label="Insurance Company"
                    data-field="insuranceCompany"
                    value={insuranceCompany}
                    onchange={handleInputChange}
                    required
                ></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small">
                <lightning-input
                    label="Policy Number"
                    data-field="policyNumber"
                    value={policyNumber}
                    onchange={handleInputChange}
                    required
                ></lightning-input>
            </div>
        </div>

        <div class="slds-m-bottom_small">
            <lightning-textarea
                label="Current Medications"
                data-field="medications"
                value={medications}
                onchange={handleInputChange}
                placeholder="List all current medications..."
            ></lightning-textarea>
        </div>

        <div class="slds-m-bottom_small">
            <lightning-textarea
                label="Allergies"
                data-field="allergies"
                value={allergies}
                onchange={handleInputChange}
                placeholder="List any known allergies..."
            ></lightning-textarea>
        </div>

        <div class="slds-m-top_medium slds-p-top_medium" style="border-top: 1px solid #e5e5e5;">
            <lightning-input
                label="Signature (Full Name)"
                data-field="signatureName"
                value={signatureName}
                onchange={handleInputChange}
                required
                placeholder="Type your full legal name as signature"
            ></lightning-input>
        </div>

        <div class="slds-grid slds-grid_align-end slds-m-top_medium">
            <lightning-button label="Cancel" variant="neutral" onclick={handleCancel} class="slds-m-right_small"></lightning-button>
            <lightning-button label="Save & Continue" variant="brand" onclick={handleSave} disabled={isSaving}></lightning-button>
        </div>

        <template lwc:if={isSaving}>
            <lightning-spinner alternative-text="Saving" size="small"></lightning-spinner>
        </template>
    </div>
</template>
