<template>
    <div class="slds-card slds-p-around_medium">
        <h2 class="slds-text-heading_medium slds-m-bottom_medium">Client Waiver</h2>

        <template lwc:if={isCompleted}>
            <div class="slds-notify slds-notify_alert slds-alert_success slds-m-bottom_medium" role="alert">
                <span>This waiver has already been signed.</span>
            </div>
        </template>

        <div class="slds-box slds-m-bottom_medium waiver-text" style="max-height: 400px; overflow-y: auto; background: #fafaf9; padding: 1.5rem;">
            <p class="slds-text-body_regular">
                <strong>Assumption of Risk and Release of Liability</strong>
            </p>
            <p class="slds-text-body_regular slds-m-top_small">
                I understand that horseback riding and equine-assisted activities involve inherent risks, including but not limited to bodily injury, property damage, and even death. I voluntarily assume all risks associated with participation in We Can Ride programs.
            </p>
            <p class="slds-text-body_regular slds-m-top_small">
                I hereby release, waive, and discharge We Can Ride, its officers, directors, employees, volunteers, and agents from any and all liability, claims, demands, and causes of action arising out of or related to any loss, damage, or injury sustained during participation.
            </p>
            <p class="slds-text-body_regular slds-m-top_small">
                I have read this waiver, fully understand its terms, and sign it freely and voluntarily.
            </p>
        </div>

        <div class="slds-form-element slds-m-bottom_medium">
            <div class="slds-form-element__control">
                <lightning-input
                    type="checkbox"
                    label="I acknowledge that I have read, understand, and agree to the terms of this waiver."
                    checked={acknowledged}
                    onchange={handleAcknowledge}
                    required
                ></lightning-input>
            </div>
        </div>

        <div class="slds-grid slds-wrap slds-gutters">
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                <lightning-input
                    label="Signature (Full Legal Name)"
                    value={signatureName}
                    onchange={handleSignatureChange}
                    required
                    placeholder="Type your full legal name"
                ></lightning-input>
            </div>
        </div>

        <div class="slds-grid slds-grid_align-end slds-m-top_medium">
            <lightning-button label="Cancel" variant="neutral" onclick={handleCancel} class="slds-m-right_small"></lightning-button>
            <lightning-button label="Save & Continue" variant="brand" onclick={handleSave} disabled={isSaving}></lightning-button>
        </div>

        <template lwc:if={isSaving}>
            <lightning-spinner alternative-text="Saving" size="small"></lightning-spinner>
        </template>
    </div>
</template>
