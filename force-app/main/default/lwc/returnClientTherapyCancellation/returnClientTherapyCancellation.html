<template>
    <div class="slds-card slds-p-around_medium">
        <h2 class="slds-text-heading_medium slds-m-bottom_medium">Hippotherapy Cancellation Policy</h2>

        <template lwc:if={isCompleted}>
            <div class="slds-notify slds-notify_alert slds-alert_success slds-m-bottom_medium" role="alert">
                <span>This form has already been signed.</span>
            </div>
        </template>

        <div class="slds-box slds-m-bottom_medium" style="max-height: 400px; overflow-y: auto; background: #fafaf9; padding: 1.5rem;">
            <p class="slds-text-body_regular">{waiverDescription}</p>
        </div>

        <div class="slds-grid slds-wrap slds-gutters">
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_medium">
                <lightning-input
                    label="Full Name"
                    value={fullName}
                    data-field="fullName"
                    onchange={handleInputChange}
                    required
                    placeholder="Type your full legal name"
                ></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_medium">
                <lightning-input
                    type="date"
                    label="Date"
                    value={signedDate}
                    data-field="signedDate"
                    onchange={handleInputChange}
                    required
                ></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_medium">
                <lightning-combobox
                    label="Authorization"
                    value={authorization}
                    data-field="authorization"
                    options={authorizationOptions}
                    onchange={handleInputChange}
                    required
                    placeholder="Select authorization"
                ></lightning-combobox>
            </div>
        </div>

        <div class="slds-grid slds-grid_align-end slds-m-top_medium">
            <lightning-button label="Cancel" variant="neutral" onclick={handleCancel} class="slds-m-right_small"></lightning-button>
            <lightning-button label="Save & Continue" variant="brand" onclick={handleSave} disabled={isSaving}></lightning-button>
        </div>

        <template lwc:if={isSaving}>
            <lightning-spinner alternative-text="Saving" size="small"></lightning-spinner>
        </template>
    </div>
</template>
